name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Copy the deployable files unchanged. No build or dependency install.
      - name: Collect static files
        env:
          SITE_DIR: ${{ runner.temp }}/site
        run: |
          mkdir -p "$SITE_DIR"
          cp index.html *.css *.js favicon.svg CNAME robots.txt .nojekyll "$SITE_DIR/"
          cp -R fonts media vendor privacy qr assets "$SITE_DIR/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
